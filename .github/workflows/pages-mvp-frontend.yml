name: Deploy frontend-only demo

on:
  push:
    branches: [master]
    paths:
      - 'demos/mvp-frontend-only/**'
      - '.github/workflows/pages-mvp-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demos/mvp-frontend-only
      - id: deployment
        uses: actions/deploy-pages@v4
